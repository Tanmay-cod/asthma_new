services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asthma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asthma}
      POSTGRES_DB: ${POSTGRES_DB:-asthma}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
